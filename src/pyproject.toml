[project]
name = "ranklab"
version = "0.1.0"
description = "Candidate-search infrastructure and offline checks"
requires-python = ">=3.11"
dependencies = [
    "turbopuffer==2.13.0",
    "voyageai==0.5.0",
    "requests==2.34.2",
    "PyYAML==6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ranklab"
module-root = ""
